server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # دعم توجيه الـ SPA: أي مسار غير موجود → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # تخزين مؤقت طويل للملفات الثابتة (لها أسماء فريدة عند كل بناء)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ضغط Gzip لتسريع التحميل
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}